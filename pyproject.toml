[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slippage-guard"
version = "0.2.1"
description = "Pre-flight slippage checker against live L2 order books"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Alex Carter", email = "alex@carterlabs.cc" }
]
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
    "websockets>=11.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "respx>=0.20.0",
]

[project.scripts]
slippage-guard = "slippage_guard.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["slippage_guard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
